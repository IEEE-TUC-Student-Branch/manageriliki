name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Build dependencies: OpenSSL for libssh2, libudev for serial ports.
  APT_PACKAGES: pkg-config libssl-dev libudev-dev

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Mesa's software Vulkan driver lets the headless GUI test render screenshots.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        env:
          MGR_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$MGR_SCREENSHOT_DIR"
          cargo test --workspace --locked
      - name: Security invariants
        run: cargo test -p manageriliki-core --test safety --locked -- --nocapture
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - name: Binaries exist
        run: test -x target/release/manageriliki-tui && test -x target/release/manageriliki-gui

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
